name: Build Vivify .so

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
    
    - name: Install QPM
      run: |
        wget -q https://github.com/QuestPackageManager/QPM.CLI/releases/download/v0.16.6/qpm-0.16.6-linux-x64
        chmod +x qpm-0.16.6-linux-x64
        sudo mv qpm-0.16.6-linux-x64 /usr/local/bin/qpm
    
    - name: Restore QPM dependencies
      run: qpm restore
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release \
          -G "Ninja"
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Upload libVivify.so artifact
      uses: actions/upload-artifact@v4
      with:
        name: libVivify.so
        path: build/libVivify.so
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/libVivify.so
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
